<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0608" />
  <title>SUPERNARE ²</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090507;
      --text: #fff7f9;
      --muted: #a58f97;
      --pink: #ff176f;
      --hot: #ff4b1f;
      --gold: #ffc857;
      --line: rgba(255,255,255,.12);
      --glass: rgba(24, 10, 16, .62);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      overflow: hidden;
      isolation: isolate;
    }

    /* Fondo ambiental lento: pensado para quedar encendido durante horas en un TV. */
    body::after {
      content: "";
      position: fixed;
      inset: -35%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 25% 30%, rgba(255, 23, 111, .28), transparent 22%),
        radial-gradient(circle at 75% 35%, rgba(255, 75, 31, .20), transparent 24%),
        radial-gradient(circle at 55% 78%, rgba(255, 200, 87, .10), transparent 20%),
        radial-gradient(circle at 12% 82%, rgba(180, 20, 100, .15), transparent 22%);
      filter: blur(55px) saturate(125%);
      animation: ambient 24s ease-in-out infinite alternate;
      transform-origin: center;
    }

    /* Textura sutil, inspirada en flyers de boliche / reggaetón 2010s */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px),
        radial-gradient(circle, rgba(255,255,255,.12) 0 1px, transparent 1px);
      background-size: auto, 5px 5px;
      mix-blend-mode: overlay;
    }



    .neon {
      position: fixed;
      width: 46vw;
      height: 46vw;
      min-width: 300px;
      min-height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      opacity: .16;
      z-index: -1;
      mix-blend-mode: screen;
    }

    .neon.one {
      background: var(--pink);
      top: -24vw;
      left: -20vw;
      animation: floatOne 19s ease-in-out infinite alternate;
    }

    .neon.two {
      background: var(--hot);
      right: -22vw;
      bottom: -25vw;
      animation: floatTwo 23s ease-in-out infinite alternate;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      position: relative;
      z-index: 1;
    }

    .wrap {
      width: min(1080px, 100%);
      text-align: center;
      animation: enter .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 15px;
      border: 1px solid rgba(255,23,111,.28);
      border-radius: 999px;
      background: rgba(255,23,111,.065);
      box-shadow: 0 0 35px rgba(255,23,111,.08);
      color: #e8cdd5;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 8px var(--pink), 0 0 20px var(--pink);
      animation: pulse 1.2s ease-in-out infinite;
    }

    #mainTitle {
      position: relative;
      z-index: 2;
      margin: 24px 0 2px;
      font-family: Anton, Impact, sans-serif;
      font-size: clamp(68px, 14vw, 150px);
      line-height: .84;
      letter-spacing: .015em;
      color: #fff;
      text-shadow:
        0 2px 0 #7e123e,
        0 0 18px rgba(255,23,111,.25),
        0 0 70px rgba(255,23,111,.13);
      transform: scaleX(.94);
    }

    .sup {
      color: var(--pink);
      text-shadow: 0 0 20px rgba(255,23,111,.75);
    }

    .subtitle {
      margin: 20px auto 42px;
      color: var(--muted);
      font-size: clamp(12px, 2vw, 15px);
      letter-spacing: .14em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .subtitle b {
      color: #f7d9e2;
      font-weight: 800;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .unit {
      position: relative;
      min-height: 170px;
      display: grid;
      place-items: center;
      padding: 28px 10px 24px;
      border: 1px solid var(--line);
      border-top-color: rgba(255,23,111,.27);
      border-radius: 6px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), transparent 55%),
        var(--glass);
      box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.05),
        0 0 0 1px rgba(255,23,111,.025);
      backdrop-filter: blur(18px);
      overflow: hidden;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .unit::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--pink), transparent);
      opacity: .7;
    }

    .unit::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.06), transparent 65%);
      transform: translateX(-120%);
      animation: shine 5s ease-in-out infinite;
    }

    .unit:nth-child(2)::after { animation-delay: .7s; }
    .unit:nth-child(3)::after { animation-delay: 1.4s; }
    .unit:nth-child(4)::after { animation-delay: 2.1s; }

    .number {
      display: block;
      font-variant-numeric: tabular-nums;
      font-family: Anton, Impact, sans-serif;
      font-size: clamp(58px, 9vw, 94px);
      line-height: .9;
      letter-spacing: .025em;
      color: #fff;
      text-shadow: 0 0 28px rgba(255,23,111,.12);
    }

    .unit.is-zero {
      background: #1a1a1a;
      border-color: #3a3a3a;
      box-shadow: none;
    }

    .unit.is-zero::before,
    .unit.is-zero::after {
      background: transparent;
      animation: none;
    }

    .unit.is-zero .number {
      color: #6b6b6b;
      text-shadow: none;
    }

    .unit.is-zero .label {
      color: #4d4d4d;
    }

    .unit.active {
      border-color: rgba(255,23,111,.6);
      animation: activeGlow 1.8s ease-in-out infinite;
    }

    .unit.active .number {
      text-shadow: 0 0 30px rgba(255,23,111,.55), 0 0 60px rgba(255,23,111,.25);
    }

    .unit.active .label {
      color: #e8b6c6;
    }

    @keyframes activeGlow {
      0%, 100% {
        box-shadow:
          0 25px 80px rgba(0,0,0,.35),
          inset 0 1px rgba(255,255,255,.05),
          0 0 22px rgba(255,23,111,.28);
      }
      50% {
        box-shadow:
          0 25px 80px rgba(0,0,0,.35),
          inset 0 1px rgba(255,255,255,.05),
          0 0 48px rgba(255,23,111,.65);
      }
    }

    .label {
      display: block;
      margin-top: 14px;
      color: #8f737d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    footer {
      margin-top: 26px;
      color: #715b63;
      font-size: 11px;
      letter-spacing: .06em;
    }

    footer strong {
      color: #b995a1;
      font-weight: 700;
    }

    .footer-line {
      margin-top: 8px;
      color: #b86b83;
      font-weight: 700;
      font-style: italic;
    }

    .done {
      font-family: Anton, Impact, sans-serif;
      font-size: clamp(50px, 9vw, 100px);
      letter-spacing: .03em;
      color: var(--pink);
      text-shadow: 0 0 35px rgba(255,23,111,.45);
    }


    .event-started main {
      min-height: 100vh;
    }

    /* Fondo mucho más rápido y en movimiento constante una vez que el evento arrancó. */
    body.event-started::after {
      animation-duration: 6s;
    }

    body.event-started .neon.one {
      animation-duration: 5s;
    }

    body.event-started .neon.two {
      animation-duration: 6s;
    }

    /* --- Entrada del evento: se ejecuta una sola vez y termina. --- */

    .event-started .wrap {
      width: 100%;
      position: relative;
      animation:
        eventReveal 1s cubic-bezier(.2,.8,.2,1) both,
        impactPunch .45s ease-out 1s both;
    }

    /* Onda de choque cuando las letras "aterrizan". */
    .event-started .wrap::before {
      content: "";
      position: absolute;
      top: 48%;
      left: 50%;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: shockwave .8s cubic-bezier(.15,.8,.3,1) 1s both;
    }

    /* Destello corto y contenido, solo alrededor del título (no en toda la pantalla). */
    .event-started .wrap::after {
      content: "";
      position: absolute;
      top: 10%;
      left: 10%;
      right: 10%;
      bottom: 10%;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.8), transparent 65%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      animation: flashPop .6s ease-out 1s both;
    }

    .event-started #mainTitle {
      margin: 0;
      font-size: clamp(95px, 18vw, 250px);
      letter-spacing: .01em;
      display: inline-block;
      text-shadow:
        0 3px 0 #7e123e,
        0 0 28px rgba(255,23,111,.38),
        0 0 100px rgba(255,23,111,.22);
      animation: titleBreathe 6s ease-in-out 2.3s infinite alternate;
    }

    /* Cada letra cae/gira y encastra en su lugar, con stagger. */
    .event-started #mainTitle .letter,
    .event-started #mainTitle .sup {
      display: inline-block;
      opacity: 0;
      transform-origin: bottom center;
      animation: letterDrop .62s cubic-bezier(.16,1,.3,1) both;
      animation-delay: calc(var(--i, 0) * 0.05s + 0.05s);
      will-change: transform, opacity, filter;
    }

    .event-started #mainTitle .sup {
      margin-left: .1em;
      color: var(--pink);
      text-shadow: 0 0 20px rgba(255,23,111,.75);
    }

    /* Capa duplicada, invisible salvo por el brillo: el "clip" hace que
       la luz solo se vea dentro de las letras, nunca fuera de ellas. */
    .event-started .title-shine {
      position: absolute;
      inset: 0;
      color: transparent;
      background-image: linear-gradient(100deg,
        transparent 42%,
        rgba(255,255,255,.95) 49%,
        rgba(255,255,255,.95) 53%,
        transparent 60%);
      background-size: 220% 100%;
      background-position: 160% 0;
      -webkit-background-clip: text;
      background-clip: text;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      animation: textShine 1s ease-in-out 1.25s both;
    }

    @keyframes ambient {
      0%   { transform: translate3d(-5%, -3%, 0) scale(1); }
      35%  { transform: translate3d(7%, 5%, 0) scale(1.08); }
      70%  { transform: translate3d(-3%, 9%, 0) scale(1.02); }
      100% { transform: translate3d(8%, -4%, 0) scale(1.12); }
    }

    @keyframes floatOne {
      0%   { transform: translate(-4vw, -2vh) scale(.92); }
      50%  { transform: translate(22vw, 18vh) scale(1.18); }
      100% { transform: translate(7vw, 38vh) scale(1.04); }
    }

    @keyframes floatTwo {
      0%   { transform: translate(4vw, 3vh) scale(1); }
      50%  { transform: translate(-25vw, -15vh) scale(1.2); }
      100% { transform: translate(-8vw, -35vh) scale(.95); }
    }

    @keyframes eventReveal {
      from { opacity: 0; transform: scale(.88); filter: blur(12px); }
      to   { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes impactPunch {
      0%   { transform: scale(1) translate(0, 0); }
      25%  { transform: scale(1.035) translate(-3px, 2px); }
      50%  { transform: scale(.985) translate(3px, -2px); }
      75%  { transform: scale(1.01) translate(-1px, 1px); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes shockwave {
      0%   { opacity: .85; transform: translate(-50%, -50%) scale(0); border-width: 3px; }
      70%  { opacity: .2; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(16); border-width: 0; }
    }

    @keyframes flashPop {
      0%   { opacity: 0; }
      30%  { opacity: .8; }
      100% { opacity: 0; }
    }

    @keyframes letterDrop {
      0% {
        opacity: 0;
        transform: translateY(70px) rotate(calc(var(--dir, 1) * 16deg)) scale(.3);
        filter: blur(12px);
      }
      55% {
        opacity: 1;
        transform: translateY(-10px) rotate(calc(var(--dir, 1) * -3deg)) scale(1.1);
        filter: blur(0);
      }
      75% {
        transform: translateY(4px) scale(.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes textShine {
      0%   { background-position: 160% 0; opacity: 0; }
      12%  { opacity: 1; }
      60%  { background-position: -60% 0; opacity: 1; }
      100% { background-position: -160% 0; opacity: 0; }
    }

    @keyframes titleBreathe {
      from { transform: scaleX(.92) scale(1); opacity: .94; }
      to   { transform: scaleX(.92) scale(1.035); opacity: 1; }
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(24px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulse {
      50% { opacity: .35; transform: scale(.65); }
    }

    @keyframes shine {
      0%, 65%, 100% { transform: translateX(-120%); }
      82% { transform: translateX(120%); }
    }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(55px, 35px) scale(1.12); }
    }

    @keyframes rotateGlow {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 680px) {
      body { overflow: auto; }
      main { min-height: 100svh; padding: 24px 18px; }
      .countdown { grid-template-columns: repeat(2, 1fr); }
      .unit { min-height: 145px; }
      .subtitle { margin-bottom: 30px; }
    }

    @media (max-width: 390px) {
      .countdown { gap: 8px; }
      .unit { min-height: 132px; }
      .number { font-size: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }

      .event-started #mainTitle .letter,
      .event-started #mainTitle .sup {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }

      .event-started .title-shine {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="neon one"></div>
  <div class="neon two"></div>

  <main>
    <section class="wrap">
      <div class="eyebrow">
        <span class="dot"></span>
      </div>

      <h1 id="mainTitle">SUPERNARE <span class="sup">²</span></h1>

      <p class="subtitle">
        Sábado <b>12 de septiembre de 2026</b>
      </p>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="unit">
          <span class="number" id="days">00</span>
          <span class="label">Días</span>
        </div>
        <div class="unit">
          <span class="number" id="hours">00</span>
          <span class="label">Horas</span>
        </div>
        <div class="unit">
          <span class="number" id="minutes">00</span>
          <span class="label">Minutos</span>
        </div>
        <div class="unit">
          <span class="number" id="seconds">00</span>
          <span class="label">Segundos</span>
        </div>
      </div>

      <footer>
        <strong>Argentina · UTC−03:00</strong>
        <div class="footer-line">Videla en el metegol te hago pelota</div>
      </footer>
    </section>
  </main>

  <script>
    // ✏️ ACÁ agregá o sacá las frases que querés que roten en el footer.
    // Cada vez que se carga/recarga la página, se elige una al azar.
    const footerPhrases = [
      "Videla en el metegol te hago pelota",
      "PUTERÍA PUTERÍA",
      "hasta el pis de los gatos",
      "70/30",
      "Leo dame queque",
      "debería estar estudiando, no haciendo esta web de mierda",
      "Todo pedo es responsabilidad de Uriel",
      "FUERA DEL PLANETA ELLA ES",
      "beer pong si o no",
      "portense bien loco",
      "no es super nare 2, es al cuadrado",
      "https://open.spotify.com/playlist/1sxOeINiQkbK1jqp2Hv7qz?si=c1bbe6519c5349c2",
      "ig @tomasfloores_"
    ];

    // Objetivo fijo en hora argentina (UTC-03:00).
    const target = new Date("2026-09-12T21:00:00-03:00").getTime();

    // 🔧 TESTING: poner en true para forzar el estado "evento iniciado"
    // y ver los estilos finales sin esperar a la fecha real.
    const FORCE_EVENT_STARTED = false;

    const $ = id => document.getElementById(id);

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function setRandomFooterPhrase() {
      const el = document.querySelector(".footer-line");
      if (!el || footerPhrases.length === 0) return;

      const storageKey = "supernare_shown_phrases";
      let shown = [];

      try {
        shown = JSON.parse(localStorage.getItem(storageKey)) || [];
      } catch {
        shown = [];
      }

      // Mientras queden frases sin mostrar, elegimos entre esas.
      const available = footerPhrases.filter(phrase => !shown.includes(phrase));

      let choice;
      if (available.length > 0) {
        choice = available[Math.floor(Math.random() * available.length)];
        shown.push(choice);
        try {
          localStorage.setItem(storageKey, JSON.stringify(shown));
        } catch {
          // Si localStorage falla (modo privado, etc.), seguimos sin romper la web.
        }
      } else {
        // Ya se mostraron todas: a partir de acá, random libre (con repetición).
        choice = footerPhrases[Math.floor(Math.random() * footerPhrases.length)];
      }

      el.textContent = choice;
    }

    setRandomFooterPhrase();

    // Se ejecuta UNA sola vez, en el instante exacto en que arranca el evento.
    let eventAnimationTriggered = false;

    function triggerEventEntrance() {
      if (eventAnimationTriggered) return;
      eventAnimationTriggered = true;

      document.body.classList.add("event-started");
      $("countdown").style.display = "none";
      document.querySelector(".eyebrow").style.display = "none";
      document.querySelector(".subtitle").style.display = "none";
      document.querySelector("footer").style.display = "none";

      const title = $("mainTitle");
      if (!title) return;

      // Envuelve cada letra en su propio <span> para animarla individualmente.
      const word = "SUPERNARE";
      let lettersHTML = "";
      [...word].forEach((ch, i) => {
        const dir = i % 2 === 0 ? 1 : -1;
        lettersHTML += `<span class="letter" style="--i:${i};--dir:${dir}">${ch}</span>`;
      });
      lettersHTML += `<span class="sup" style="--i:${word.length};--dir:1">²</span>`;

      title.innerHTML = lettersHTML;
      title.setAttribute("aria-label", "SUPERNARE al cuadrado");

      // Capa de brillo: mismo texto, pero clippeado para que la luz
      // solo se vea sobre las letras, nunca fuera de ellas.
      const shine = document.createElement("span");
      shine.className = "title-shine";
      shine.setAttribute("aria-hidden", "true");
      shine.textContent = "SUPERNARE ²";
      title.appendChild(shine);
    }

    function update() {
      const remaining = target - Date.now();

      if (FORCE_EVENT_STARTED || remaining <= 0) {
        triggerEventEntrance();
        return;
      }

      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      setUnit("days", days);
      setUnit("hours", hours);
      setUnit("minutes", minutes);
      setUnit("seconds", seconds, { skipZeroStyle: true });

      setActiveUnit([days, hours, minutes, seconds]);
    }

    function setActiveUnit(values) {
      const ids = ["days", "hours", "minutes", "seconds"];
      let activeIndex = values.findIndex(value => value !== 0);
      if (activeIndex === -1) activeIndex = ids.length - 1;

      ids.forEach((id, i) => {
        const unitBlock = $(id).closest(".unit");
        if (unitBlock) unitBlock.classList.toggle("active", i === activeIndex);
      });
    }

    function setUnit(id, value, options = {}) {
      const el = $(id);
      el.textContent = pad(value);

      if (options.skipZeroStyle) return;

      const unitBlock = el.closest(".unit");
      if (unitBlock) unitBlock.classList.toggle("is-zero", value === 0);
    }

    update();
    setInterval(update, 250);
  </script>
</body>
</html>
